# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 文件存储抽象：local 本地磁盘（默认，兼容历史文件）/ oss 阿里云私有桶
  # 说明：本地开发用 local 无需任何 OSS 凭据；生产切 oss 时凭据只从环境变量注入，
  #      AK/SK 严禁写入本文件、Dockerfile、启动脚本或提交到 git。
  storage:
    # 写模式：local | oss
    type: local
    # 读取兜底：OSS 读不到时尝试本地（迁移期/回滚期建议 true）
    read-fallback: true
    oss:
      # 地域节点（环境变量 OSS_ENDPOINT）
      endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
      # 私有 Bucket（环境变量 OSS_BUCKET）；type=oss 时缺失则启动失败
      bucket: ${OSS_BUCKET:}
      # 凭据只允许来自环境变量；此处仅占位，缺省为空 → type=oss 时启动期强校验失败
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      # ECS 实例 RAM 角色（无静态 AK/SK）：置 true 时上面两项可留空
      use-instance-role: ${OSS_USE_INSTANCE_ROLE:false}
      # RAM 角色名（可留空，自动从 ECS 元数据发现）
      ram-role-name: ${OSS_RAM_ROLE_NAME:}
      # 私有桶：不使用公网直链；图片走 /common/attach 代理，文档走 /oa/file/{id}
      private: true
      # 可选：CDN/自定义域名（public 模式才用；私有模式留空）
      public-domain: ""
      # 签名 URL 有效期（备用能力，不存库、不下发业务附件）
      sign-expire-seconds: 7200
      # key 前缀（多环境共用桶时隔离，如 dev/、prod/）
      key-prefix: ${OSS_KEY_PREFIX:}
      connect-timeout: 10000
      socket-timeout: 60000

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
    # OSS SDK 压到 warn，避免 debug 日志打印签名请求头/凭据
    com.aliyun.oss: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（工单 Word 允许 20MB，留 multipart 余量）
      max-file-size: 25MB
      # 设置总上传的文件大小（20MB 文件 + multipart 边界需 ≥30MB）
      max-request-size: 30MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    # 注意：本机可能同时跑其它若依系项目，务必使用独立库（不要和它们共用 db0），
    # 否则 login_tokens / sys_dict / sys_config 等同名 key 会互相污染，
    # 表现为 Redis 里的 LoginUser 反序列化成 JSONObject 后类型转换失败。
    database: 1
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# Flowable 流程引擎
flowable:
  # 启动时自动补齐 ACT_* 表（只新增缺失的表，不删除已有数据）
  database-schema-update: true
  # 历史级别：audit 记录流程实例、任务、活动，够用且比 full 省空间
  history-level: audit
  # 异步执行器：暂无定时边界/异步任务，先关闭
  async-executor-activate: false
  # 流程定义由 OaProcessDeployer 显式部署（fat jar 里自动扫描不可靠），这里关闭自动扫描避免重复部署
  check-process-definitions: false
  # 关闭 IDM，用户与部门体系复用若依
  idm:
    enabled: false

# 组织人事（人员录入）模块配置
oa:
  # H5 报名验证码：v1 使用图形验证码，不依赖短信通道
  captcha:
    # 图形验证码有效期（秒）
    expire-seconds: 300
    # 图形验证码校验通过后的令牌有效期（分钟），用于 H5 上传与提交
    verify-token-minutes: 30
    # 报名进度查询令牌有效期（分钟），用于撤回/修改重提
    query-token-minutes: 30
    # 同一 IP 在 10 分钟内验证码失败上限，超过返回 429
    fail-limit: 10
  submit:
    # 同一手机号 24 小时内最大提交次数
    phone-24h-limit: 5
  import:
    # Excel 单次最大数据行数
    max-rows: 500
    # Excel 文件最大体积（MB）
    max-file-size-mb: 10
    # 确认导入时每批提交行数
    batch-size: 100
  account:
    # 初始密码规则：phone-last-6（手机号后 6 位）
    init-password: phone-last-6
  sensitive:
    # 干事视角是否打码（R12：部长/主席团/管理员/本人明文）
    mask-staff: true
  # 任务协作（任务派发 / 周期任务）模块配置
  task:
    job:
      # 三个定时任务总开关（维护期可关）
      enabled: true
    # 看板单列最大卡片数
    board-max-cards: 300
    # 单用户单次提醒超过该数量时合并为一条汇总
    remind-merge-threshold: 10
    # 站内信批量写入大小
    notify-batch-size: 200
    # 退会联动批量取消任务大小
    retire-cancel-batch: 100
    # 截止前 N 天提醒（基线=1）
    due-remind-days: 1
  # 志愿活动
  volunteer:
    # H5 报名页地址（二维码内容 = 该地址 + /volunteer/apply?activityId=x）
    h5-base-url: http://localhost:80

